name: Run Tests

on:
  push:
    branches:
      - main
      - master
      - 'patch-*'
    tags:
      - '**'
  pull_request:
  # Run on merge queue groups.
  merge_group:
    types: [ checks_requested ]
  schedule:
     - cron: '0 6 * * 1' # 6am Monday
  workflow_dispatch:

jobs:


  build_exclusions:

    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      excludes: ${{ join(steps.*.outputs.excludes) }}
      run_tests: ${{ github.event_name != 'merge_group' }}
      check_links: ${{ github.event_name != 'merge_group' }}
    steps:
      - id: no_exclude
        name: Run all builds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        # On scheduled runs, manual workflow dispatches, and tag pushes, run the full matrix across
        # all OSes and SDK channels.
        run: echo 'excludes=[]' >> $GITHUB_OUTPUT
      - id: exclude_master
        name: Exclude beta and non-Linux builds on master
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        # On pushes to master (which occur once per combined batch from the merge queue), run all
        # bots on Linux stable, excluding only:
        # - all betas
        # - Windows
        # - macOS
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"}]' >> $GITHUB_OUTPUT
      - id: exclude_pr
        name: Exclude beta, non-Linux, and secondary bots on PRs
        if: github.event_name == 'pull_request'
        # To speed up CI on every PR, in addition to excluding beta, Windows, and macOS, we also
        # exclude secondary/slower bots.
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"}]' >> $GITHUB_OUTPUT
      - id: exclude_merge_group
        name: Exclude all builds except misc if running on merge queue
        if: github.event_name == 'merge_group'
        # GitHub's merge queue dispatches a merge_group event for every individual PR in the queue,
        # only batching the final push to master. Exclude everything except misc (stable,
        # ubuntu-latest), which will just run lint/build/grammar tests, and let the full Linux
        # stable suite run once on the combined push to master.
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"},{"bot":"dart"}]' >> $GITHUB_OUTPUT

  build:

    name: "${{ matrix.bot }} (${{ matrix.build-version }} ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: build_exclusions

    strategy:
      fail-fast: false
      # build-version and bot dimensions intentionally mirror Dart-Code's matrix structure
      # so build_exclusions and merge-guard behave identically when testing workflows.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
        build-version: [stable, beta]
        bot: [dart, misc]
        exclude: ${{ fromJSON(needs.build_exclusions.outputs.excludes) }}

    env:
      RUN_TESTS: ${{ needs.build_exclusions.outputs.run_tests }}

    steps:

      - uses: actions/checkout@v7

      - name: Set up Node v${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm install
        run: npm install

      - name: npm lint
        run: npm run lint

      - name: npm build
        run: npm run build

      # Test-Extension is a dummy extension for workflow testing; npm test is a stub
      # to mirror Dart-Code's CI steps.
      - name: npm test
        if: env.RUN_TESTS == 'true'
        run: npm test

  link_check:
    name: Check Links (Lychee)
    needs: build_exclusions
    if: needs.build_exclusions.outputs.check_links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --root-dir ./
            --exclude-all-private
            --exclude '\$\%7B[^}]+\%7D'
            --exclude "^file://"
            ./src/**/*.ts
            ./*.md
            package.json

  # A single action based on the test outcome that can be used
  # as a required status check. link_check is intentionally excluded
  # so external website link failures do not block PR merges.
  merge-guard:
    permissions:
      contents: none
    name: Merge Guard
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail if the build check did not pass.
      - name: Check results
        if: needs.build.result != 'success'
        run: |
          echo "::error title=Merge Guard::One or more build jobs did not succeed (${{ needs.build.result }})."
          exit 1

  notify_failure:

    permissions:
      contents: none
    name: Notify Discord of Failure
    needs: build
    if: failure() && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'schedule') && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch)) && github.repository_owner == 'Dart-Code'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Send notification to Discord
        run: 'if ($env:DISCORD_WEBHOOK) { Invoke-WebRequest -Headers @{ "Content-Type" = "application/json" } -Method Post -Body "{`"content`":`"Build failed on $($env:GITHUB_REF.Replace(`"refs/heads/`", `"`")): https://github.com/$($env:GITHUB_REPOSITORY)/commit/$($env:GITHUB_SHA)/checks`"}" -Uri $env:DISCORD_WEBHOOK }'
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
